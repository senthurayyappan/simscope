site_name: "simscope"
site_description: "Record and replay robot simulation rollouts."
site_url: https://senthurayyappan.github.io/simscope/
repo_url: https://github.com/senthurayyappan/simscope
repo_name: senthurayyappan/simscope
strict: true

theme:
  name: shadcn
  show_title: true
  show_stargazers: false
  show_datetime: false

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - CLI: cli.md
  - API reference: api.md
  - Design: design.md
  - Developing: developing.md

plugins:
  - shadcn/search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            allow_inspection: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - fenced_code
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
