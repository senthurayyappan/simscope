[project]
name = "python-template"
version = "0.1.0"
description = "A uv-first Python repository template"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.15",
    "ty>=0.0.72",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "N",
    "A",
    "G",
    "T10",
    "PGH",
    "D",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ty.src]
include = [
    "configure.py",
    "tests",
    ".template/smoke.py",
    ".template/update_manifest.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
branch = true
include = ["configure.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
