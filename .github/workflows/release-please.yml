name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Publish this existing tag, such as v0.1.1
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # github.token must not open the release pull request. GitHub does not
      # run workflows on events that token creates, so CI on the release pull
      # request never starts. RELEASE_PLEASE_TOKEN is the credential that lets
      # those workflows run. See CONTRIBUTING.md.
      - name: Require RELEASE_PLEASE_TOKEN
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_PLEASE_TOKEN}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set. It is required so CI can run on the release pull request. The default GITHUB_TOKEN opens that pull request as github-actions[bot], and GitHub does not run workflows that token triggers."
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: release
    # A later run does not recreate an existing release, so release_created
    # stays false. Dispatch this workflow with publish_tag to publish that tag.
    if: >-
      vars.PUBLISH_PYPI == 'true' &&
      (
        needs.release.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name || inputs.publish_tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # A release job that can publish should not restore a shared cache.
          enable-cache: false
      - run: uv sync --locked --group docs
      - run: uv run pre-commit run --all-files
      - run: uv run --group docs mkdocs build --strict
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv build --no-sources
      - run: uv publish --trusted-publishing always
